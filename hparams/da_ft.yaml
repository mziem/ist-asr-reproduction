# ============================================================
# da_ft.yaml
# Whisper-small + LoRA fine-tuned on JASMIN with inline data augmentation:
#   - Speed perturbation: 90 / 100 / 110 % (SpeedPerturb, SpeechBrain built-in)
#   - SpecAugment: frequency band drop + temporal chunk drop (SpeechBrain built-in)
#
# Both augmentations are applied on-the-fly during training only.
# concat_original: True means the unaugmented batch is preserved alongside
# the augmented copies, effectively doubling / tripling the batch.
#
# Training set: csv/jasmin/train.csv  (same as Atyp_FT, no extra data)
# Evaluated on CGN-BN, CGN-CTS, and JASMIN non-native test sets.
# ============================================================

seed: 42
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]

output_folder: /scratch/mziemlewski/speechbrain/recipes/final-report/results/da_ft
output_wer_folder: !ref <output_folder>/wer
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt

whisper_hub: /scratch/mziemlewski/hub/models--openai--whisper-small/snapshots/973afd24965f72e36ca33b3055d56a652f456b4d
whisper_folder: !ref <save_folder>/whisper_checkpoint

normalized_transcripts: False

data_folder: /scratch/mziemlewski/speechbrain/recipes/final-report
skip_prep: True

train_csv: /scratch/mziemlewski/speechbrain/recipes/final-report/csv/jasmin/train.csv
valid_csv: /scratch/mziemlewski/speechbrain/recipes/final-report/csv/jasmin/valid.csv
test_csv:
    - /scratch/mziemlewski/speechbrain/recipes/final-report/csv/cgn/test_bn.csv
    - /scratch/mziemlewski/speechbrain/recipes/final-report/csv/cgn/test_cts.csv
    - /scratch/mziemlewski/speechbrain/recipes/final-report/csv/jasmin/test.csv

ckpt_interval_minutes: 30

# ── Training ─────────────────────────────────────────────────
number_of_epochs: 5
freeze_encoder: False
weight_decay: 0.01
lr_whisper: 1.25e-5
warmup_steps: 500
max_grad_norm: 2.0
sorting: ascending
precision: fp16
eval_precision: fp16
sampling_rate: 16000

batch_size: 2
test_batch_size: 2
grad_accumulation_factor: 8

min_decode_ratio: 0.0
max_decode_ratio: 1.0
test_beam_size: 8
lora_rank: 16

# ── DataLoaders ──────────────────────────────────────────────
train_loader_kwargs:
    batch_size: !ref <batch_size>

valid_loader_kwargs:
    batch_size: !ref <test_batch_size>

test_loader_kwargs:
    batch_size: !ref <test_batch_size>

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

# ── Augmentation ─────────────────────────────────────────────
# Speed perturbation: simulate rate variation common in non-native speech.
# Speeds [90, 100, 110] shift duration by ±10 %; concat_original=True
# preserves the original utterance so no data is discarded.
speed_perturb: !new:speechbrain.augment.time_domain.SpeedPerturb
    orig_freq: !ref <sampling_rate>
    speeds: [90, 100, 110]

# SpecAugment: frequency-band dropout + temporal chunk dropout.
# drop_freq removes random mel-frequency bands (models spectral uncertainty).
# drop_chunk removes temporal segments (models missing frames / coarticulation).
drop_freq: !new:speechbrain.augment.time_domain.DropFreq
    drop_freq_low: 0
    drop_freq_high: 1
    drop_freq_count_low: 1
    drop_freq_count_high: 3
    drop_freq_width: 0.05

drop_chunk: !new:speechbrain.augment.time_domain.DropChunk
    drop_length_low: 1
    drop_length_high: 5
    drop_count_low: 1000
    drop_count_high: 2000

# Augmenter: applies speed_perturb first, then SpecAugment (drop_freq + drop_chunk).
# min/max_augmentations=3 means all three are applied every step.
# concat_original=True: unaugmented version is kept alongside augmented copies.
wav_augment: !new:speechbrain.augment.augmenter.Augmenter
    concat_original: True
    min_augmentations: 3
    max_augmentations: 3
    augment_prob: 1.0
    augmentations: [
        !ref <speed_perturb>,
        !ref <drop_freq>,
        !ref <drop_chunk>]

# ── Model ────────────────────────────────────────────────────
whisper_pretrained: !new:speechbrain.integrations.huggingface.whisper.Whisper
    source: !ref <whisper_hub>
    freeze_encoder: !ref <freeze_encoder>
    save_path: !ref <whisper_folder>
    language: "nl"
    task: "transcribe"
    sampling_rate: !ref <sampling_rate>

whisper: !new:speechbrain.nnet.adapters.AdaptedModel
    model_to_adapt: !ref <whisper_pretrained>
    adapter_class: !name:speechbrain.nnet.adapters.LoRA
    all_linear: True
    adapter_kwargs:
        rank: !ref <lora_rank>

log_softmax: !new:speechbrain.nnet.activations.Softmax
    apply_log: True

nll_loss: !name:speechbrain.nnet.losses.nll_loss

modules:
    whisper: !ref <whisper>

# ── Optimiser & Scheduler ────────────────────────────────────
whisper_opt_class: !name:torch.optim.AdamW
    lr: !ref <lr_whisper>
    weight_decay: !ref <weight_decay>

valid_search: !new:speechbrain.decoders.seq2seq.S2SWhisperGreedySearcher
    model: !ref <whisper>
    min_decode_ratio: !ref <min_decode_ratio>
    max_decode_ratio: !ref <max_decode_ratio>

test_search: !new:speechbrain.decoders.seq2seq.S2SWhisperBeamSearcher
    module: [!ref <whisper>]
    min_decode_ratio: !ref <min_decode_ratio>
    max_decode_ratio: !ref <max_decode_ratio>
    beam_size: !ref <test_beam_size>

lr_annealing_whisper: !new:speechbrain.nnet.schedulers.NoamScheduler
    lr_initial: !ref <lr_whisper>
    n_warmup_steps: !ref <warmup_steps>

# ── Checkpointer ─────────────────────────────────────────────
checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        whisper: !ref <whisper>
        scheduler_whisper: !ref <lr_annealing_whisper>
        counter: !ref <epoch_counter>

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

error_rate_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats
cer_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats
    split_tokens: True
